# ═══════════════════════════════════════════════
#  my_custom_pkg 파라미터 설정 파일
# ═══════════════════════════════════════════════

waypoint_follower_node:
  ros__parameters:
    waypoint_csv: "/home/jsmoon/yax_jeju/waypoints.csv"
    arrive_dist_m: 1.2
    speed_forward: 50.0
    speed_slow: 30.0
    slow_dist_m: 1.2
    max_steering: 7
    k_p: -0.55
    k_i: -0.01
    k_d: -0.16
    steering_alpha: 0.3
    stop_wp_indices: "[]"
    pause_wp_indices: "[]"
    pause_seconds: 0.0
    reverse_ranges: ""

lane_detection_node:
  ros__parameters:
    sub_path_topic: "path_planning_result"
    sub_lane_topic: "yolov8_lane_info"
    car_center_x: 320
    car_center_y: 180
    lookahead_distance: 20.0
    kp: 22.0
    ki: 0.0
    kd: 1.5
    smoothing_factor: 0.3
    max_steer: 7.0  
    default_speed: 20.0
    lane_timeout_sec: 1.0

tunnel_nav_node:
  ros__parameters:
    sub_lidar_topic: "/scan"

    # 콘 감지 범위 (m)
    cone_detect_dist_m: 1.5
    # 스캔 각도 범위 (deg) — 전방 ±30° 제외
    left_angle_min_deg: 20.0
    left_angle_max_deg: 70.0
    right_angle_min_deg: -70.0
    right_angle_max_deg: -20.0

    # 클러스터링 파라미터
    cluster_gap_m: 0.1        # 포인트 간 끊김 기준 (m)
    cone_min_width_m: 0.03     # 콘 최소 폭 (m)
    cone_max_width_m: 0.5      # 콘 최대 폭 (m)
    cone_min_points: 3         # 클러스터 최소 포인트 수

    # 콘 구간 진입 기준 (좌/우 각각 최소 콘 개수)
    min_cones_per_side: 1

    # 조향
    k_cone: 3.0
    max_steering: 7.0
    cone_speed: 20.0

    # 히스테리시스 (연속 감지/미감지 프레임 수)
    entry_count_threshold: 3
    exit_count_threshold: 7

obstacle_detect_node:
  ros__parameters:
    sub_lidar_topic: "/scan"
    front_half_angle_deg: 10.0
    stop_distance_m: 0.7
    consec_detect_threshold: 3
    consec_clear_threshold: 3

mission_controller_node:
  ros__parameters:
    pub_topic: "topic_control_signal"
    max_steering: 7
    max_abs_pwm: 255
