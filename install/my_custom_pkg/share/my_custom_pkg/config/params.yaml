# ═══════════════════════════════════════════════
#  my_custom_pkg 파라미터 설정 파일
# ═══════════════════════════════════════════════

waypoint_follower_node:
  ros__parameters:
    waypoint_csv: "/home/jsmoon/yax_jeju/waypoints.csv"
    arrive_dist_m: 1.5
    speed_forward: 110.0
    speed_slow: 80.0
    slow_dist_m: 2.5
    max_steering: 7
    # PID — EKF 스무딩된 입력 기준 튜닝
    k_p: -0.85            # P게인
    k_i: -0.005           # I게인
    k_d: -0.1             # D게인
    steering_alpha: 0.7   # 로우패스
    steering_step_hyst: 1 # 히스테리시스
    steering_rate_limit: 4 # 레이트리밋
    max_angular: 1.0       # 최대 각속도
    integral_max: 0.5
    integral_min: -0.5
    stop_wp_indices: "[]"
    pause_wp_indices: "[]"
    pause_seconds: 0.0
    reverse_ranges: ""
    # EKF 칼만필터 — RTK GPS (ZED-F9P) 기준 튜닝
    ekf_q_pos: 0.3        # 프로세스 노이즈 — 위치 (등속모델 불확실성)
    ekf_q_yaw: 0.15       # 프로세스 노이즈 — 헤딩 (yaw 변화 허용폭)
    ekf_q_vel: 0.8        # 프로세스 노이즈 — 속도 (가감속 허용)
    ekf_r_gps: 0.1        # GPS 관측 노이즈 ↓↓ (RTK ~2cm → GPS 강하게 신뢰)
    ekf_r_yaw: 0.15       # 헤딩 관측 노이즈 ↓ (NavPVT 헤딩 신뢰)

lane_detection_node:
  ros__parameters:
    sub_path_topic: "path_planning_result"
    sub_lane_topic: "yolov8_lane_info"
    car_center_x: 320
    car_center_y: 180
    lookahead_distance: 30.0
    kp: 25.0
    ki: 0.0
    kd: 1.6
    smoothing_factor: 0.3
    max_steer: 7.0  
    default_speed: 110.0
    lane_timeout_sec: 1.0

tunnel_nav_node:
  ros__parameters:
    sub_lidar_topic: "/scan"

    # 콘 감지 범위 (m)
    cone_detect_dist_m: 3.0
    # 스캔 각도 범위 (deg) — 전방 ±30° 제외
    left_angle_min_deg: 00.0
    left_angle_max_deg: 60.0
    right_angle_min_deg: -60.0
    right_angle_max_deg: -0.0

    # 클러스터링 파라미터
    cluster_gap_m: 0.25       # 포인트 간 끊김 기준 (m) — 콘 개별 분리
    cone_min_width_m: 0.00      # 콘 최소 폭 (m) — 1포인트 클러스터 허용
    cone_max_width_m: 0.5      # 콘 최대 폭 (m)
    cone_min_points: 1         # 클러스터 최소 포인트 수

    # 콘 구간 진입 기준 (좌/우 각각 최소 콘 개수)
    min_cones_per_side: 1

    # 조향
    k_cone: 9.0
    max_steering: 7.0
    cone_speed: 90.0

    # 경로 생성
    lane_half_width_m: 0.50    # 콘 통로 반폭 (체인 1개일 때 오프셋)
    lookahead_m: 1.5           # 전방 주시 거리 (중앙선에서 타겟 포인트 선택)
    cone_link_max_dist_m: 1.8  # 같은 경계로 연결할 콘 간 최대 거리
    curve_gain: 2.5            # 1체인 곡률 증폭 (1.0=그대로, >1=안쪽으로 더 조향)

    # 히스테리시스 (연속 감지/미감지 프레임 수)
    entry_count_threshold: 2
    exit_count_threshold: 15

cone_camera_node:
  ros__parameters:
    sub_image_topic: "/camera/image_raw"

    # BEV 변환 포인트 (소스: 이미지 사다리꼴, 목적지: 직사각형)
    # [좌하x, 좌하y, 우하x, 우하y, 우상x, 우상y, 좌상x, 좌상y]
    bev_src_points: [100, 480, 540, 480, 400, 300, 240, 300]
    bev_dst_points: [150, 400, 250, 400, 250, 0, 150, 0]
    bev_width: 400
    bev_height: 400

    # 주황색 콘 검출 — HSV
    hsv_lower: [5, 100, 100]
    hsv_upper: [25, 255, 255]

    # 주황색 콘 검출 — LAB
    lab_lower: [100, 140, 160]
    lab_upper: [220, 200, 220]

    # 주황색 콘 검출 — RGB
    rgb_lower: [180, 80, 0]
    rgb_upper: [255, 180, 80]

    # 컨투어 필터링
    min_contour_area: 100
    max_contour_area: 50000

    # ROI 상단 제거 비율 (0.3 = 상위 30% 무시)
    roi_top_ratio: 0.3

    # 조향
    k_cone: 7.0
    max_steering: 7.0
    cone_speed: 80.0

    # 히스테리시스
    entry_count_threshold: 2
    exit_count_threshold: 15
    min_cones_per_side: 1

obstacle_detect_node:
  ros__parameters:
    sub_lidar_topic: "/scan"
    front_half_angle_deg: 15.0
    stop_distance_m: 1.2
    consec_detect_threshold: 3
    consec_clear_threshold: 3

mission_controller_node:
  ros__parameters:
    pub_topic: "topic_control_signal"
    max_steering: 7
    max_abs_pwm: 255
